apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ${jupyter_namespace}
  labels:
    app: jupyterhub
    component: hub
  name: hub-persistentvolumes
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ${jupyter_namespace}
  labels:
    app: jupyterhub
    component: hub
  name: hub-events-creation
rules:
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "list", "get"]
---

